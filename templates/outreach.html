<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7f9;font-family:Georgia,'Times New Roman',serif;color:#1a1a1a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f7f9;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e6e8ec;">
            <tr>
              <td style="padding:28px 28px 8px;font-size:15px;line-height:1.55;">
                <p style="margin:0 0 16px;">Hi {{name}},</p>
                <p style="margin:0 0 16px;">
                  I’m reaching out from {{company}} about {{topic}}.
                  If this is useful, reply to this email and I’ll share a short next step.
                </p>
                <p style="margin:0 0 16px;">
                  Thanks,<br />
                  {{sender_name}}<br />
                  <span style="color:#555;">{{company}}</span>
                </p>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.4;color:#777;">
                  You’re receiving this because you {{consent_reason}}.
                  <a href="{{unsubscribe_url}}" style="color:#555;">Unsubscribe</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
